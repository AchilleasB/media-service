#         with:
#           go-version: ${{ env.GO_VERSION }}
#           cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

#       - name: Download dependencies
#         working-directory: ${{ env.WORKING_DIR }}
#         run: go mod download

#       - name: Run golangci-lint
#         uses: golangci/golangci-lint-action@v6
#         with:
#           version: v1.60.1
#           working-directory: ${{ env.WORKING_DIR }}
#           args: --timeout=5m ./...

#       - name: Check Go mod tidy
#         working-directory: ${{ env.WORKING_DIR }}
#         run: |
#           go mod tidy
#           git diff --exit-code go.mod go.sum

  # ==========================================================================
  # JOB 2: Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Run Unit Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Running Unit Tests..."
          go test -v -race -coverprofile=unit-coverage.out ./test/api/unit/...

      - name: Generate Coverage Report
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go tool cover -func=unit-coverage.out
          echo "Coverage report generated"

      - name: Upload Unit Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: ${{ env.WORKING_DIR }}/unit-coverage.out
          retention-days: 7

  # ==========================================================================
  # JOB 3: Integration Tests
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      # MongoDB for database integration tests
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Run Integration Tests
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TEST_MONGO_URI: "mongodb://localhost:27017"
        run: |
          echo "Running API Integration Tests..."
          go test -v -race -coverprofile=integration-coverage.out ./test/api/integration/...

      - name: Upload Integration Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: ${{ env.WORKING_DIR }}/integration-coverage.out
          retention-days: 7

  # ==========================================================================
  # JOB 4: Trigger OKD Build & Deploy
  # ==========================================================================
  # Triggers OKD BuildConfig via webhook after all tests pass.
  # OKD will pull the code, build the image, and deploy automatically.
  deploy:
    name: Trigger OKD Build & Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger OKD BuildConfig Webhook
        run: |
          echo "Triggering OKD BuildConfig webhook..."
          echo "OKD will pull the code, build the image, and deploy."
          
          # Generic webhook - secret is embedded in URL path, no auth header needed
          # -k flag allows self-signed certificates
          curl -X POST "${{ secrets.OKD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"commit": "${{ github.sha }}", "ref": "${{ github.ref }}"}' \
            -k --fail --silent --show-error
          
          echo "OKD build triggered successfully!"

      - name: Deployment Summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | media-service |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered at | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** OKD is now building the image and will deploy automatically." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 5: Notify on Failure
  # ==========================================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    # needs: [lint, unit-tests, integration-tests, deploy]
    if: failure()
    
    steps:
      - name: Create failure summary
        run: |
          echo "## Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more jobs failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Author | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

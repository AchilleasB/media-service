# GitHub Actions CI/CD Pipeline for Media Service
# =============================================================================
# This workflow runs tests and triggers OKD to build and deploy
#
# WORKFLOW OVERVIEW:
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │                           CI/CD PIPELINE                                    │
# │                                                                             │
# │  GITHUB ACTIONS (Test & Validate)              OKD (Build & Deploy)         │
# │  ┌──────────┐   ┌──────────┐   ┌──────────┐   ┌─────────────────────────┐   │
# │  │  Lint    │──▶│  Unit    │──▶│ Integr.  │──▶│ Trigger OKD BuildConfig │ │
# │  │  Check   │   │  Tests   │   │  Tests   │   │ (OKD builds & deploys)  │   │
# │  └──────────┘   └──────────┘   └──────────┘   └─────────────────────────┘   │
# │                                                                             │
# │  All tests must pass before OKD build is triggered                          │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# TRIGGER: Push to main branch or pull request

name: Media Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

# Environment variables shared across jobs
env:
  GO_VERSION: '1.24'
  SERVICE_NAME: media-service
  WORKING_DIR: .

jobs:
  # ==========================================================================
  # JOB 1: Lint and Static Analysis (DISABLED TEMPORARILY)
  # ==========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.WORKING_DIR }}
          args: --timeout=5m ./...

      - name: Check Go mod tidy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ==========================================================================
  # JOB 2: Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Run Unit Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Running Unit Tests..."
          go test -v -race -coverprofile=unit-coverage.out ./test/api/unit/...

      - name: Generate Coverage Report
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go tool cover -func=unit-coverage.out
          echo "Coverage report generated"

      - name: Upload Unit Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: ${{ env.WORKING_DIR }}/unit-coverage.out
          retention-days: 7

  # ==========================================================================
  # JOB 3: Integration Tests
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      # MongoDB for database integration tests
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Run Integration Tests
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TEST_MONGO_URI: "mongodb://localhost:27017"
        run: |
          echo "Running API Integration Tests..."
          go test -v -race -coverprofile=integration-coverage.out ./test/api/integration/...

      - name: Upload Integration Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: ${{ env.WORKING_DIR }}/integration-coverage.out
          retention-days: 7

  # ==========================================================================
  # JOB 4: Trigger OKD Build & Deploy (DISABLED DUE TO FIREWALL)
  # ==========================================================================
  # Triggers OKD BuildConfig via webhook after all tests pass.
  # OKD will pull the code, build the image, and deploy automatically.
  deploy:
    name: Trigger OKD Build & Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"
      
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OKD_URL }}
          openshift_token: ${{ secrets.OKD_TOKEN }}
          insecure_skip_tls_verify: true

      - name: Start OpenShift Build
        run: |
          echo "Starting building the image in OKD..."
          oc start-build media-service -n cloud-09-development --follow --wait

          echo "Triggering rollouts..."
          oc rollout restart deploy/media-service -n cloud-09-development
          
      - name: Verify Deployment
        run: |
          echo "Checking rollout status..."
          oc rollout status deploy/media-service -n cloud-09-development --timeout=2m

      - name: Deployment Summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | media-service |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered at | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** OKD is now building the image and will deploy automatically." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 5: Notify on Failure
  # ==========================================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, deploy]
    if: failure()
    
    steps:
      - name: Create failure summary
        run: |
          echo "## Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more jobs failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Author | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
